<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Bazvor — Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <main class="auth-page">

    <!-- TOP -->
    <header class="auth-header">

      <button
        type="button"
        class="back-button"
        id="backButton"
        aria-label="Go back"
      >
        <i class="fa-solid fa-arrow-left"></i>
      </button>

      <span class="header-brand">
        Bazvor
      </span>

      <span class="header-space"></span>

    </header>


    <section class="auth-container">

      <!-- BRAND -->
      <div class="brand-section">

        <div class="brand-logo">
          B
        </div>

        <h1 id="authTitle">
          Welcome to Bazvor
        </h1>

        <p id="authSubtitle">
          Login to continue shopping
        </p>

      </div>


      <!-- TABS -->
      <div class="auth-tabs">

        <button
          type="button"
          id="loginTab"
          class="auth-tab active"
        >
          Login
        </button>

        <button
          type="button"
          id="registerTab"
          class="auth-tab"
        >
          Create Account
        </button>

      </div>


      <!-- MESSAGE -->
      <div
        class="auth-message"
        id="authMessage"
        role="alert"
      ></div>


      <!-- =============================================
           LOGIN FORM
      ============================================== -->
      <form
        id="loginForm"
        class="auth-form"
        novalidate
      >

        <div class="input-group">

          <label for="loginEmail">
            Email address
          </label>

          <div class="input-box">

            <i class="fa-regular fa-envelope"></i>

            <input
              type="email"
              id="loginEmail"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >

          </div>

        </div>


        <div class="input-group">

          <div class="label-row">

            <label for="loginPassword">
              Password
            </label>

            <button
              type="button"
              class="forgot-button"
              id="forgotPasswordButton"
            >
              Forgot password?
            </button>

          </div>

          <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              class="password-toggle"
              type="button"
              data-password-target="loginPassword"
              aria-label="Show password"
            >
              <i class="fa-regular fa-eye"></i>
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="primary-button"
          id="loginButton"
        >
          <span>Login</span>

          <i class="fa-solid fa-arrow-right"></i>
        </button>


        <p class="switch-text">
          Don't have an account?

          <button
            type="button"
            id="openRegister"
          >
            Create Account
          </button>
        </p>

      </form>


      <!-- =============================================
           REGISTER FORM
      ============================================== -->
      <form
        id="registerForm"
        class="auth-form hidden"
        novalidate
      >

        <div class="input-group">

          <label for="registerName">
            Full name
          </label>

          <div class="input-box">

            <i class="fa-regular fa-user"></i>

            <input
              type="text"
              id="registerName"
              placeholder="Enter your full name"
              autocomplete="name"
              maxlength="60"
              required
            >

          </div>

        </div>


        <div class="input-group">

          <label for="registerPhone">
            Mobile number
          </label>

          <div class="input-box">

            <i class="fa-solid fa-phone"></i>

            <input
              type="tel"
              id="registerPhone"
              placeholder="01XXXXXXXXX"
              autocomplete="tel"
              inputmode="tel"
              maxlength="20"
            >

          </div>

        </div>


        <div class="input-group">

          <label for="registerEmail">
            Email address
          </label>

          <div class="input-box">

            <i class="fa-regular fa-envelope"></i>

            <input
              type="email"
              id="registerEmail"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >

          </div>

        </div>


        <div class="input-group">

          <label for="registerPassword">
            Password
          </label>

          <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="registerPassword"
              placeholder="Minimum 6 characters"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              class="password-toggle"
              type="button"
              data-password-target="registerPassword"
              aria-label="Show password"
            >
              <i class="fa-regular fa-eye"></i>
            </button>

          </div>

        </div>


        <div class="input-group">

          <label for="confirmPassword">
            Confirm password
          </label>

          <div class="input-box">

            <i class="fa-solid fa-shield-halved"></i>

            <input
              type="password"
              id="confirmPassword"
              placeholder="Enter password again"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              class="password-toggle"
              type="button"
              data-password-target="confirmPassword"
              aria-label="Show password"
            >
              <i class="fa-regular fa-eye"></i>
            </button>

          </div>

        </div>


        <label class="terms-row">

          <input
            type="checkbox"
            id="termsCheckbox"
          >

          <span>
            I agree to the
            <a href="#">Terms & Conditions</a>
            and
            <a href="#">Privacy Policy</a>
          </span>

        </label>


        <button
          type="submit"
          class="primary-button"
          id="registerButton"
        >
          <span>Create Account</span>

          <i class="fa-solid fa-arrow-right"></i>
        </button>


        <p class="switch-text">
          Already have an account?

          <button
            type="button"
            id="openLogin"
          >
            Login
          </button>
        </p>

      </form>

    </section>

  </main>


  <script
    type="module"
    src="auth.js"
  ></script>

</body>
</html>
